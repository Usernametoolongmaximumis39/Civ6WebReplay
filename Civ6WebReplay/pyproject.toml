[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civ6-webreplay"
version = "0.44"
description = "Civ6 WebReplay - replay Civilization VI saves in your browser"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27", "python-multipart>=0.0.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
civ6-webreplay = "civ6replay.__main__:main"
civ6replay = "civ6replay.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
